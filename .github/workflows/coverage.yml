name: Code Coverage

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@dev
    with:
      python_version: '3.11'
      coverage_source: 'hivemind_plugin_manager'
      test_path: 'tests/'
      # `test_extras` installs `.[test]`; `install_extras` is passed to
      # `uv pip install` verbatim, so it would try to install a package
      # literally named "test" and fail the job.
      test_extras: 'test'
      # Ratchet floor, not a target. The job never reached this gate before —
      # it died at install — so 70 was aspirational and unmeasured. Real
      # coverage is 40%. This floor fails a regression today; raise it as
      # tests land. The target is still 70.
      min_coverage: 40
